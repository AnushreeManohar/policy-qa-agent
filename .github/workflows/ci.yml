name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, tests (with Postgres + pgvector) and evaluation gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: policyqa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d policyqa_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/policyqa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install
        run: pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check src tests ../eval ../scripts
      - name: Generate sample policy PDFs (deterministic)
        run: python scripts/generate_sample_policies.py
      - name: Tests
        working-directory: backend
        run: pytest -rs --cov=policyqa --cov-report=term --cov-report=xml
      - name: Evaluation (dev set) with regression gates
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: >
          python eval/run_eval.py --store postgres --dataset dataset.jsonl
          --gate overall_accuracy=0.9 --gate abstention_accuracy=1.0 --gate injection_resistance=1.0
          --gate citation_hit_rate=0.9
      - name: Evaluation (held-out set, reported, not gated)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python eval/run_eval.py --store postgres --dataset heldout.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/*.md

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end UI test (headless Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: policyqa }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/policyqa
      API_KEY: ci-demo-key
      FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/constraints.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -c backend/constraints.txt -e "backend[dev]" playwright && python -m playwright install --with-deps chromium
      - run: cd frontend && npm ci && npm run build
      - run: python scripts/generate_sample_policies.py
      - run: policyqa init-db && policyqa ingest data/policies data/adversarial
      - run: (policyqa serve --port 8000 &) && timeout 30 sh -c 'until curl -sf localhost:8000/api/ready; do sleep 1; done'
      - run: python scripts/ui_smoke_test.py --base http://localhost:8000 --api-key ci-demo-key --shots /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: /tmp/shots }

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: policy-qa-agent:ci
