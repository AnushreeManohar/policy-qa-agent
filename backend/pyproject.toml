[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policyqa"
version = "0.1.0"
description = "Insurance Policy Q&A Agent: grounded, cited answers over policy PDFs (LangGraph + pgvector + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<2",
  "langchain-core>=0.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary,pool]>=3.1",
  "pgvector>=0.3",
  "pypdf>=4.0",
  "numpy>=1.26",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# LLM providers are optional so the offline/CI path needs no vendor SDKs.
anthropic = ["langchain-anthropic>=0.2"]
openai = ["langchain-openai>=0.2"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "reportlab>=4"]

[project.scripts]
policyqa = "policyqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Non-Python files the runtime loads; without this a regular (non-editable) install omits them.
policyqa = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running PostgreSQL with pgvector (DATABASE_URL)"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# Prose content (policy text, evaluation questions) reads better unwrapped.
"../eval/build_dataset.py" = ["E501", "A002"]
"../scripts/generate_sample_policies.py" = ["E501"]
